name: NodeJS test then deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DEMO

    strategy:
      matrix:
        node-version: [22.14.0]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_IA_SERVER_URL: ${{ vars.NEXT_PUBLIC_IA_SERVER_URL }}
          NEXT_PUBLIC_VA_SERVER_URL: ${{ vars.NEXT_PUBLIC_VA_SERVER_URL }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
        run: |
          npm ci
          npm run build --if-present

  deploy:
    runs-on: self-hosted
    needs: build
    environment: DEMO

    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_IA_SERVER_URL: ${{ vars.NEXT_PUBLIC_IA_SERVER_URL }}
          NEXT_PUBLIC_VA_SERVER_URL: ${{ vars.NEXT_PUBLIC_VA_SERVER_URL }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
        run: |
          npm ci
          npm run build --if-present

      - name: Create env file
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}" > .env
          echo "NEXT_PUBLIC_IA_SERVER_URL=${{ vars.NEXT_PUBLIC_IA_SERVER_URL }}" >> .env
          echo "NEXT_PUBLIC_VA_SERVER_URL=${{ vars.NEXT_PUBLIC_VA_SERVER_URL }}" >> .env
          echo "AUTH_URL=${{ secrets.AUTH_URL }}" >> .env
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}" >> .env
          echo "AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}" >> .env

      - name: Deploy
        run: pm2 restart frontend
